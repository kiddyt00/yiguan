# 主机级 Nginx —— 生产实际配置（对应 /etc/nginx/conf.d/zgjz.insightj.cn.conf）
# 滚动更新改造：frontend 双实例池 :8081 / :8082 + 失败自动重试
# 上线: 复制到 /etc/nginx/conf.d/zgjz.insightj.cn.conf && nginx -t && systemctl reload nginx
# 备注: 旧域名 gjz.shadouyou.cloud 的配置是独立文件，与本文件无关，无需改动

upstream frontend_pool {
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
    keepalive 32;
}

server {
    listen 80;
    server_name zgjz.insightj.cn;
    client_max_body_size 10M;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zgjz.insightj.cn;
    client_max_body_size 10M;

    ssl_certificate /etc/nginx/conf.d/certs/zgjz.insightj.cn.fullchain.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/zgjz.insightj.cn.key;

    # 滚动更新：前端双实例池，失败自动重试到存活实例
    proxy_next_upstream error timeout http_502 http_503 http_504;

    # SSE stream - no buffering
    location /api/divine/stream {
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    location /api/ {
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 自定义错误页（仅页面入口拦截；/api/* 保持 JSON 错误原样透传）
    # 页面文件位于宿主机 /var/www/yiguan/{404,502}.html（由 deploy/error/ 部署）
    location = /404.html { root /var/www/yiguan; internal; }
    location = /502.html { root /var/www/yiguan; internal; }

    location / {
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 页面 404 / 维护（502/503/504）显示自定义页；错误码原样保留
        proxy_intercept_errors on;
        error_page 404 /404.html;
        error_page 502 503 504 /502.html;
    }
}
