# 主机级 Nginx —— 与老服务器 (49.235.108.61) 配置一致
# 安装: cp deploy/host-nginx.conf /etc/nginx/conf.d/gjz.shadouyou.cloud.conf
#        nginx -t && systemctl reload nginx
# (SSL certs 需要先拷贝到 /etc/nginx/conf.d/certs/)

server {
    listen 80;
    server_name gjz.shadouyou.cloud ***REMOVED***;
    client_max_body_size 10M;
    rewrite ^(.*) https://$server_name$1 permanent;
}

server {
    listen 443 ssl;
    server_name gjz.shadouyou.cloud ***REMOVED***;
    client_max_body_size 10M;

    ssl_certificate /etc/nginx/conf.d/certs/gjz.shadouyou.cloud.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/gjz.shadouyou.cloud.key;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    access_log /var/log/nginx/ccieerror.log;

    # SSE stream - no buffering
    location /api/divine/stream {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    # All other traffic
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://localhost:8080;
    }
}
