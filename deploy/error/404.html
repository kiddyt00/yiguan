<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面不存在 — 真观己斋</title>
<style>
  /* Hallmark · component-scope: error page · genre: utilitarian · theme: inherit (项目墨色/暖底 token) */
  :root{--bg:#faf8f4;--ink:#26221c;--muted:#8a8173;--line:#e5dfd3}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow-x:clip}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  main{max-width:560px;width:100%;padding:40px 28px}
  .code{font-size:72px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  h1{font-size:18px;font-weight:600;margin-top:22px}
  .desc{margin-top:10px;font-size:14px;line-height:1.9;color:var(--muted)}
  .ops{margin-top:34px;display:flex;gap:10px;flex-wrap:wrap}
  .op{font-size:14px;padding:9px 22px;border-radius:6px;text-decoration:none;display:inline-block;line-height:1.5}
  .op.primary{background:var(--ink);color:#fff}
  .op.primary:hover{background:#3a342c}
  .op.secondary{border:1px solid var(--line);color:var(--ink)}
  .op.secondary:hover{border-color:var(--ink)}
  .brand{margin-top:56px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>页面不存在</h1>
    <p class="desc">您访问的地址可能已失效，或被移动到了其他位置。请检查链接，或从首页重新进入。</p>
    <div class="ops">
      <a class="op primary" href="/">返回首页</a>
      <a class="op secondary" href="/admin">管理后台</a>
    </div>
    <div class="brand">真观己斋 · zgjz.insightj.cn</div>
  </main>
</body>
</html>
