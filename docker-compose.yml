services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: yiguan-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DB_PATH=/data/yiguan.db
      - JWT_SECRET=${JWT_SECRET}
      - LLM_API_KEY=${LLM_API_KEY}
      - SERVER_PORT=8080
      - ADMIN_PHONE=${ADMIN_PHONE}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - WX_OPEN_APPID=${WX_OPEN_APPID}
      - WX_OPEN_SECRET=${WX_OPEN_SECRET}
      - WX_PAY_MCHID=${WX_PAY_MCHID}
      - WX_PAY_API_KEY=${WX_PAY_API_KEY}
      - WX_PAY_APPID=${WX_PAY_APPID}
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: yiguan-frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
